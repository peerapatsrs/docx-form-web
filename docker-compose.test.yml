services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docx
      POSTGRES_PASSWORD: docx
      POSTGRES_DB: docx_form
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docx -d docx_form"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgres://docx:docx@db:5432/docx_form
      BETTER_AUTH_SECRET: test-secret-change-me-32characters
      BETTER_AUTH_URL: http://web:3000
      NEXT_PUBLIC_APP_URL: http://web:3000
      SUPERADMIN_EMAILS: peerapat.srs@gmail.com
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s

  test:
    image: node:22-bookworm-slim
    depends_on:
      web:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      BASE_URL: "http://web:3000"
    command: ["node", "scripts/smoke-test.mjs"]
