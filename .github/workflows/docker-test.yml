name: Docker test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker smoke tests
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
