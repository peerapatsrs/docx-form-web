services:
  web:
    build: .
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s

  test:
    image: node:22-bookworm-slim
    depends_on:
      web:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      BASE_URL: "http://web:3000"
    command: ["node", "scripts/smoke-test.mjs"]
